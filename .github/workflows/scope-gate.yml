name: VM2 Backslash Scope Gate
permissions: read-all
on:
  pull_request:

jobs:
  detect-scopes:
    runs-on: ubuntu-24.04
    outputs:
      backslash: ${{ fromJSON(steps.scopes.outputs.scopes).backslash }}
      normal: ${{ fromJSON(steps.scopes.outputs.scopes).normal }}
    steps:
      - uses: actions/checkout@v5
      - id: scopes
        uses: Mergifyio/gha-mergify-ci@v25
        with:
          action: scopes
          token: ${{ secrets.MERGIFY_TOKEN }}

  backslash-tests:
    needs: detect-scopes
    if: ${{ needs.detect-scopes.outputs.backslash == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - run: |
          echo "VM2_BACKSLASH_TEST_B7Q4_RAN=true"
          exit 1

  normal-tests:
    needs: detect-scopes
    if: ${{ needs.detect-scopes.outputs.normal == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - run: |
          echo "VM2_NORMAL_TEST_B7Q4_RAN=true"
          exit 1

  ci-gate:
    if: ${{ !cancelled() }}
    needs:
      - detect-scopes
      - backslash-tests
      - normal-tests
    runs-on: ubuntu-24.04
    steps:
      - uses: Mergifyio/gha-mergify-ci@v25
        with:
          action: wait-jobs
          jobs: ${{ toJSON(needs) }}
